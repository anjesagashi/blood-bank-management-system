<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeFlow - Notifications</title>
    <link rel="stylesheet" href="notificationsPage.css" />

    <link rel="stylesheet" href="../../components/globalCSS/globalCSS.css" />
    <link rel="stylesheet" href="../../components/header/header.css" />
    <link rel="stylesheet" href="../../components/footer/footer.css" />

    <script src="../../components/header/header.js"></script>
    <script src="../../components/footer/footer.js"></script>
  </head>
  <body>
    <section class="notifSection">
      <custom-header></custom-header>
      <div class="notificationsContainer">
        <div class="modalBody">
          <div class="notifList">
            <h3>Notifications</h3>
            <div class="notifItem" data-id="1">
              <p class="notifTitle">Përditësim i Sistemit</p>
              <small>Sot, 10:00</small>
            </div>
            <div class="notifItem" data-id="2">
              <p class="notifTitle">Mesazh nga Admin</p>
              <small>Dje, 15:30</small>
            </div>
          </div>

          <div class="notifDetails" id="notifDetailsId">
            <div class="emptyState">Zgjidhni një njoftim për ta lexuar</div>
          </div>
        </div>
      </div>
      <script src="notificationsPage.js"></script>
    </section>
    <custom-footer></custom-footer>
  </body>
</html>
